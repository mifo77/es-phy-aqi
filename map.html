<!DOCTYPE html>
<html>
<head>
    <title>AQI Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; }

        .home-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-btn">← Back to Sync</a>
    <div id="map"></div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBxsqGPW8uakxLnHVaaFwgciRaHxr6vT2Ml9s8tuLPUqryhpD-JXsqlptbyPsivG0S/exec";

        const map = L.map('map').setView([33.5731, -7.5898], 11.5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        async function loadData() {
            const response = await fetch(GOOGLE_SCRIPT_URL);
            const data = await response.json();
            
            const bounds = [];

            data.forEach(point => {
                let color = "green";
                if (point.pm2_5 > 12) color = "orange";
                if (point.pm2_5 > 35) color = "red";
                if (point.pm2_5 > 55) color = "purple";

                const marker = L.circleMarker([point.lat, point.lng], {
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.8,
                    radius: 10
                }).addTo(map);

                marker.bindPopup(`
                    <b>Time:</b> ${new Date(point.time).toLocaleString()}<br>
                    <b>PM2.5:</b> ${point.pm2_5} µg/m³<br>
                    <b>PM10:</b> ${point.pm10} µg/m³
                `);

                bounds.push([point.lat, point.lng]);
            });

            if (bounds.length > 0) map.fitBounds(bounds);
        }

        loadData();
    </script>
</body>
</html>
