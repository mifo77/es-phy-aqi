<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Synchronisation AQI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --primary: #007bff;
            --secondary: #6c757d;
            --success: #28a745;
            --bg: #f8f9fa;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: var(--bg);
            color: #333;
        }

        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 400px; 
            margin: 40px auto; 
        }

        h2 { margin-top: 0; color: #1a1a1a; }
        
        .data-box {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 1.1em;
            border: 1px solid #dee2e6;
        }

        button { 
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        #connectBtn { background-color: var(--primary); color: white; }
        #syncBtn { background-color: var(--success); color: white; }
        #syncBtn:disabled { background-color: #ccc; cursor: not-allowed; }

        button:active { transform: scale(0.98); }

        .nav-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-link:hover { text-decoration: underline; }

        #status { 
            margin-top: 20px; 
            font-size: 14px; 
            color: #666;
            font-style: italic;
        }

        .ios-warning { 
            display: none; 
            background: #fff3cd; 
            color: #856404; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            font-size: 13px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 Qualité de l'Air</h2>
        
        <div id="iosHelp" class="ios-warning">
            <strong>iPhone?</strong> Utilise <b>Bluefy</b> pour activer le Web Bluetooth.
        </div>

        <div id="dataDisplay">Connectez-vous pour récupérer les données du capteur</div>
        
        <button id="connectBtn">1. Connecter l'ESP32</button>
        <button id="syncBtn" disabled>2. Envoyer vers la base de donnée</button>

        <a href="index.html" class="map-link">← Retour à la Carte (Casablanca)</a>
        
        <div id="status">Statut : Déconnecté</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
