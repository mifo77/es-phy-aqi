<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Synchronisation AQI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --primary: #375aff;
            --success: #00c853;
            --border: #333;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card { 
            width: 90%;
            max-width: 360px;
            padding: 40px 24px;
            background: var(--card-bg);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        h2 { 
            font-size: 22px; 
            font-weight: 600; 
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 32px;
        }
        
        .data-box {
            background: #252525;
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 32px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 18px;
            color: var(--primary);
            border: 1px solid var(--border);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        button { 
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        #connectBtn { 
            background-color: var(--primary); 
            color: white; 
        }

        #syncBtn { 
            background-color: var(--success); 
            color: white; 
        }

        #syncBtn:disabled { 
            background-color: #2a2a2a; 
            color: #555; 
            cursor: not-allowed; 
        }

        button:active { 
            transform: scale(0.96); 
            opacity: 0.8;
        }

        .map-link {
            display: inline-block;
            margin-top: 32px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .map-link:hover { color: white; }

        .ios-warning { 
            display: none;
            background: rgba(255, 193, 7, 0.1); 
            color: #ffc107; 
            padding: 16px; 
            border-radius: 16px; 
            margin-bottom: 24px; 
            font-size: 13px;
            border: 1px solid rgba(255, 193, 7, 0.2);
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Qualité de l'Air</h2>
        <p class="subtitle">Casablanca</p>
        
        <div id="iosHelp" class="ios-warning">
            <b>iPhone?</b> Utilise l'app <b>Bluefy</b> pour le Bluetooth.
        </div>

        <div id="dataDisplay" class="data-box">Statut : Déconnecté</div>
        
        <div class="button-group">
            <button id="connectBtn">Connecter l'ESP32</button>
            <button id="syncBtn" disabled>Envoyer vers la base de donnée</button>
        </div>

        <a href="index.html" class="map-link">← Retour à la carte</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
